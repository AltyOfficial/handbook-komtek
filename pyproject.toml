[project]
name = "handbook-komtek"
version = "0.1.0"
description = ""
readme = "README.md"
authors = [
    { name = "Arthur", email = "alty.official.prim@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "django>=4.1,<6.0",
    "djangorestframework>=3.14,<4",
    "drf-spectacular>=0.26,<1",
    "python-dotenv>=1.0,<2",
]

[dependency-groups]
dev = [
    "ruff>=0.11.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
